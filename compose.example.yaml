# Example deployment. Copy to compose.yaml and adjust paths.
#
# THE ONE RULE: every media path must be mounted at the SAME path inside the
# *arr containers and inside muxarr. Radarr/Sonarr hand muxarr absolute paths;
# if /media means something different in each container, muxarr will reject them
# as outside its read roots and silently defer every import.
#
# The anchors below are how that rule is enforced: edit a path once and all
# three services follow. Inlining one of them into a single service is how the
# two sides drift apart.

x-media:
  downloads: &downloads /srv/downloads:/downloads
  media: &media /srv/media:/media

services:
  muxarr:
    # Pin a version rather than latest, so a restart never changes the version
    # underneath you. Swap for the build block below to run from a checkout.
    image: ghcr.io/zxibizz/muxarr:0.9.2
    # build:
    #   context: .
    #   dockerfile: Dockerfile.all-in-one
    container_name: muxarr
    restart: unless-stopped
    environment:
      # s6 starts as root and drops to these before running anything. Match the
      # uid/gid that owns your library -- the *arr containers' PUID/PGID.
      PUID: 1000
      PGID: 1000
      # Colon-separated. Must cover both download and library paths.
      MUXARR_READ_ROOTS: /downloads:/media
      MUXARR_TOKEN: ${MUXARR_TOKEN:?set MUXARR_TOKEN in .env}
      # Anything below this line can also be managed from the Settings page.
      # Setting it here pins it: the UI shows it read-only and names the
      # variable, so this file stays the source of truth for what it declares.
      MUXARR_LOG_LEVEL: INFO
      # Uncomment only if the library is on NFS/SMB or a union filesystem.
      # Staging elsewhere costs an extra full copy and loses atomicity.
      # MUXARR_SCRATCH_DIR: /scratch
      #
      # AI mode: let a language model match sidecars the filename rules cannot.
      # Off unless you set this. "fallback" only calls out when the filename
      # rules came up short, so it costs nothing on releases that already work.
      # Release folder and file NAMES are sent to the endpoint below -- never
      # file contents, never absolute paths. Point it at a local Ollama or
      # LM Studio instance to keep even the names on your own machine.
      # Easier to set up from the Settings page, which can test the provider
      # before you commit to it.
      # MUXARR_AI_MODE: fallback
      # MUXARR_AI_MODEL: gpt-4o-mini
      # MUXARR_AI_API_KEY: ${MUXARR_AI_API_KEY:-}
      # MUXARR_AI_BASE_URL: https://api.openai.com/v1
      # MUXARR_AI_NAME_TRACKS: "true"
    volumes:
      # The operation history lives here and is migrated on every start.
      # Drop this and every restart begins with an empty history.
      - ./muxarr-config:/config
      # muxarr copies the shims it ships with into here on every start, so
      # nothing needs a checkout of the source. Do not mount this over
      # /app/scripts instead: that hides the image's own copy behind whatever
      # the volume already holds, which is the staleness this is fixing.
      - shims:/shims
      - *downloads
      - *media
    networks: [arr]
    ports:
      # nginx serves the web UI and proxies /v1 to the API behind it. Drop this
      # if you only want the *arr containers to reach it.
      - "8710:8710"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    depends_on:
      muxarr:
        # Healthy, not started: the shims are published during muxarr's init,
        # and /healthz only answers once that has finished.
        condition: service_healthy
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      # Read by the shim, not by Sonarr itself.
      MUXARR_URL: http://muxarr:8710
      MUXARR_TOKEN: ${MUXARR_TOKEN:?set MUXARR_TOKEN in .env}
    volumes:
      - ./sonarr-config:/config
      - *downloads
      - *media
      - shims:/config/scripts:ro
    ports:
      - "8989:8989"
    networks: [arr]

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    depends_on:
      muxarr:
        condition: service_healthy
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      MUXARR_URL: http://muxarr:8710
      MUXARR_TOKEN: ${MUXARR_TOKEN:?set MUXARR_TOKEN in .env}
    volumes:
      - ./radarr-config:/config
      - *downloads
      - *media
      - shims:/config/scripts:ro
    ports:
      - "7878:7878"
    networks: [arr]

volumes:
  shims:
    # Named explicitly so the other stack can find it; compose would otherwise
    # prefix it with the project directory's name.
    name: muxarr-shims

networks:
  arr:
    driver: bridge

# ---------------------------------------------------------------------------
# If the *arr containers live in their own compose stack
#
# 1. DNS. Each project gets its own bridge network, so http://muxarr:8710 stops
#    resolving and the shim quietly defers every import. Share a network:
#
#        docker network create arr-shared
#
#    then in BOTH projects, replacing the `arr` network above:
#
#        networks:
#          arr-shared:
#            external: true
#
# 2. The shims. Keep the shims volume attached to muxarr here; the other stack
#    only mounts it, and must declare it external because compose will not
#    create a volume it does not own:
#
#        volumes:
#          shims:
#            external: true
#            name: muxarr-shims
#
#    depends_on cannot reach across projects, so `up` the muxarr stack first
#    after an upgrade -- otherwise the *arr containers run the previous shims
#    until muxarr has restarted.
#
# MUXARR_TOKEN is read from the *arr container's own environment, so it has to
# be repeated in that stack's .env. THE ONE RULE still applies across the two
# files, and nothing enforces it for you once the anchors are split.
# ---------------------------------------------------------------------------
