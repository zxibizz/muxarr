version: 2
updates:
  - package-ecosystem: uv
    directory: /services/backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /services/frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Only the base images; s6-overlay is fetched by URL inside the Dockerfile and
  # has to be bumped by hand.
  - package-ecosystem: docker
    directories:
      - /
    schedule:
      interval: weekly
