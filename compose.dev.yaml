# Local development: one container running the API, the worker and the Vite dev
# server, all hot-reloading.
#
#   docker compose -f compose.dev.yaml up --build
#
# UI on http://localhost:5173, API on http://localhost:8000.
#
# This is not what production looks like -- there the SPA is a static build
# behind nginx on a single port, supervised by s6. See Dockerfile.

services:
  muxarr:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: muxarr-dev
    # The whole repo is mounted, not just services/backend: the shim contract
    # tests reach back up to the repo-root scripts/ directory.
    working_dir: /repo/services/backend
    command: bash /repo/cicd/containers/dev/entrypoint.sh
    environment:
      PYTHONPATH: /repo/services/backend
      # Both roots must exist inside the container; see ./dev-media below.
      MUXARR_READ_ROOTS: /downloads:/media
      MUXARR_DB_URL: sqlite+aiosqlite:////config/muxarr.db
      MUXARR_TOKEN: ${MUXARR_TOKEN:-dev-token}
      MUXARR_LOG_LEVEL: DEBUG
      # macOS/Windows bind mounts do not deliver inotify events.
      WATCHFILES_FORCE_POLLING: "true"
      VITE_WATCH_POLLING: "true"
      VITE_API_PROXY_TARGET: http://127.0.0.1:8000
    volumes:
      - .:/repo
      - config:/config
      # Keeps the container's Linux binaries out of the host's node_modules.
      - node-modules:/repo/services/frontend/node_modules
      - ./dev-media/downloads:/downloads
      - ./dev-media/media:/media
    ports:
      - "8000:8000"
      - "5173:5173"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  config:
  node-modules:
