# Split deployment: the web container (API + UI) and the worker (the only thing
# that muxes) run separately and meet at a shared Postgres database. Copy to
# compose.yaml, adjust paths and set MUXARR_TOKEN, MUXARR_DB_PASSWORD and
# ARR_NETWORK in .env.
#
# For a single container on SQLite, use compose.example.yaml instead. This file
# is for when you want to restart or resource-limit the worker on its own, or
# keep mkvmerge and write access to the library out of the container that
# faces the network. Wiring Radarr/Sonarr up is the same as there (see the end
# of compose.example.yaml), with MUXARR_URL pointing at muxarr-web.
#
# THE ONE RULE: every media path must be mounted at the SAME path inside the
# *arr containers and inside the Muxarr WORKER. Radarr/Sonarr hand Muxarr
# absolute paths; if /media means something different in each container, the
# worker rejects them as outside its read roots and every import is deferred.
# The web container never opens a media file, so it needs no media mounts.
#
# Run exactly ONE worker. A starting worker fails every job still marked
# running, on the assumption that it is the one that died mid-mux.

# Both Muxarr containers read the same configuration. Keep it here rather than
# on one service: a variable set on only one of them is locked in the UI while
# the other still follows the Settings page.
x-muxarr-env: &muxarr-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  MUXARR_READ_ROOTS: /downloads:/media
  MUXARR_TOKEN: ${MUXARR_TOKEN:?set MUXARR_TOKEN in .env}
  # URL-encode the password if it contains anything but letters and digits.
  MUXARR_DB_URL: postgresql+asyncpg://muxarr:${MUXARR_DB_PASSWORD:?set MUXARR_DB_PASSWORD in .env}@postgres:5432/muxarr
  MUXARR_LOG_LEVEL: INFO

x-muxarr: &muxarr
  # Pin a version rather than latest, so a restart never changes the version
  # underneath you. Both containers must run the same one.
  image: ghcr.io/zxibizz/muxarr:0.9.2
  # build:
  #   context: .
  #   dockerfile: Dockerfile
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    container_name: muxarr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: muxarr
      POSTGRES_PASSWORD: ${MUXARR_DB_PASSWORD:?set MUXARR_DB_PASSWORD in .env}
      POSTGRES_DB: muxarr
    volumes:
      # The operation history, the job queue and the Settings page overrides.
      - ./muxarr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muxarr -d muxarr"]
      interval: 5s
      timeout: 5s
      retries: 10

  muxarr-web:
    <<: *muxarr
    container_name: muxarr-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *muxarr-env
      # Queues imports, answers the shims' polls and serves the UI. Runs the
      # migrations on every start.
      MUXARR_MODE: web
    volumes:
      # Republished from the image on every start; see compose.example.yaml.
      - /opt/muxarr/shims:/shims
    # The only Muxarr container the *arr apps talk to; Postgres and the worker
    # stay on this stack's own network.
    networks: [default, arr]
    ports:
      - "8710:8710"

  muxarr-worker:
    <<: *muxarr
    container_name: muxarr-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *muxarr-env
      # Claims queued imports and muxes them. Waits (up to two minutes, then
      # restarts) until muxarr-web has migrated the database.
      MUXARR_MODE: worker
      # Uncomment only if the library is on NFS/SMB or a union filesystem.
      # MUXARR_SCRATCH_DIR: /scratch
    volumes:
      # Copy these from your Radarr/Sonarr service's volumes, both sides of the
      # colon, and keep MUXARR_READ_ROOTS in step with the right-hand side.
      - /srv/downloads:/downloads
      - /srv/media:/media

networks:
  arr:
    # The network Radarr/Sonarr are already on; see compose.example.yaml.
    external: true
    name: ${ARR_NETWORK:?set ARR_NETWORK in .env to the network Radarr/Sonarr are on}
