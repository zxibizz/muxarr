# Replaces Debian's nginx.conf so nginx writes nothing outside /run: the image may be
# read-only, and is not writable at all when the container starts as non-root.
# `user` is passed on the command line, only when started as root
# (/etc/services.d/nginx/run). Error log -> stderr -> `docker logs`; the API logs
# every request itself, so there is no access log.
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log stderr;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;

    client_body_temp_path /run/nginx/client_body;
    proxy_temp_path /run/nginx/proxy;
    fastcgi_temp_path /run/nginx/fastcgi;
    uwsgi_temp_path /run/nginx/uwsgi;
    scgi_temp_path /run/nginx/scgi;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
