[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muxerr"
version = "0.1.0"
description = "Embed external audio and subtitle tracks into video containers during Radarr/Sonarr import"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The core (probe/discovery/selection/mux/placement) is deliberately stdlib-only so it
# can be unit-tested without a web framework and vendored into constrained environments.
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.27",
]
dev = [
    "muxerr[server]",
    "httpx>=0.27",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
muxerr = "muxerr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/muxerr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_mkvmerge: needs a real mkvmerge binary on PATH",
    "requires_ffmpeg: needs real ffmpeg/ffprobe binaries on PATH",
]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RET", "SIM", "S"]
ignore = ["S603"] # subprocess calls are audited by hand; every call site uses an argv list

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # asserts are the point

[tool.ruff.lint.isort]
known-first-party = ["muxerr", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/muxerr"]
