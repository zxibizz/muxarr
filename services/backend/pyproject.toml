[project]
name = "muxarr-backend"
# Mirrored in src/__init__.py and services/frontend/package.json; CI asserts they agree.
version = "0.9.2"
description = "Embed external audio and subtitle tracks into video containers during Radarr/Sonarr import"
readme = "../../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zxibizz" }]
keywords = ["radarr", "sonarr", "mkvmerge", "remux", "subtitles", "matroska"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]

# The domain layer is deliberately stdlib-only; everything below is reachable
# from infrastructure/ and api/ alone.
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # Postgres: asyncpg serves the app, psycopg the (synchronous) migrations.
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "fastapi>=0.110",
    # Only used when AI mode is enabled, and by the API tests' ASGI transport.
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.27",
]

[project.urls]
Homepage = "https://github.com/zxibizz/muxarr"
Repository = "https://github.com/zxibizz/muxarr"
Issues = "https://github.com/zxibizz/muxarr/issues"
Changelog = "https://github.com/zxibizz/muxarr/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
typecheck = ["mypy>=1.9"]
lint = ["ruff>=0.4"]

[tool.uv]
# Not a distributable package: the image puts /app on PYTHONPATH instead.
package = false
default-groups = ["lint", "typecheck", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_mkvmerge: needs a real mkvmerge binary on PATH",
    "requires_ffmpeg: needs real ffmpeg/ffprobe binaries on PATH",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RET", "SIM", "S", "ASYNC",
    "RUF", "PIE", "PT",
]
ignore = [
    "S603",     # subprocess calls are audited by hand; every call site uses an argv list
    "ASYNC109", # the long-poll hold time is the shim's contract, not a caller-side deadline
]
# Cyrillic release tags ("рус") are matched on purpose.
allowed-confusables = ["р", "у", "с"]

[tool.ruff.lint.per-file-ignores]
# asserts, dummy tokens and PATH-resolved test binaries are all intentional;
# PT012 fights `with pytest.raises(...), some_context():` blocks that must fail inside.
"tests/**" = ["S101", "S105", "S106", "S607", "PT012"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
