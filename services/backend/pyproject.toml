[project]
name = "muxarr-backend"
version = "0.1.0"
description = "Embed external audio and subtitle tracks into video containers during Radarr/Sonarr import"
readme = "../../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The domain layer is deliberately stdlib-only; everything below is reachable
# from infrastructure/ and api/ alone.
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "fastapi>=0.110",
    "loguru>=0.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.27",
]

[dependency-groups]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
typecheck = ["mypy>=1.9"]
lint = ["ruff>=0.4"]

[tool.uv]
# Not a distributable package: the image puts /app on PYTHONPATH instead.
package = false
default-groups = ["lint", "typecheck", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_mkvmerge: needs a real mkvmerge binary on PATH",
    "requires_ffmpeg: needs real ffmpeg/ffprobe binaries on PATH",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RET", "SIM", "S", "ASYNC"]
ignore = [
    "S603",     # subprocess calls are audited by hand; every call site uses an argv list
    "ASYNC109", # the long-poll hold time is the shim's contract, not a caller-side deadline
]

[tool.ruff.lint.per-file-ignores]
# asserts, dummy tokens and PATH-resolved test binaries are all intentional
"tests/**" = ["S101", "S105", "S106", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
