<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="muxarr">
  <rect width="64" height="64" rx="14" fill="#1a1b1e"/>
  <!-- Three sidecar tracks converging into one container. -->
  <g fill="none" stroke="#5c7cfa" stroke-width="5" stroke-linecap="round">
    <path d="M14 20 H30"/>
    <path d="M14 32 H30"/>
    <path d="M14 44 H30"/>
